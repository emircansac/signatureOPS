name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @signatureops/db generate
      - run: pnpm --filter @signatureops/schema test
      - run: pnpm --filter @signatureops/compiler test
      - run: pnpm --filter @signatureops/linter test
      - run: pnpm --filter @signatureops/rules test
      - run: pnpm --filter @signatureops/adapters-google test
      - run: pnpm --filter @signatureops/adapters-microsoft test
      - run: pnpm --filter @signatureops/web test:unit
      - run: pnpm --filter @signatureops/outlook-addin build
      - run: pnpm --filter @signatureops/web build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signatureops
          AUTH_SECRET: ci-auth-secret-at-least-16
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PHASE: phase-production-build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signatureops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signatureops
      AUTH_SECRET: ci-auth-secret-at-least-16
      AUTH_BYPASS: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @signatureops/db generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @signatureops/web test:e2e
