name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @signatureops/db generate
      # Workspace packages export dist/; turbo honors test.dependsOn ^build so
      # @signatureops/schema (and the rest) exist before Vitest/Next resolve them.
      - run: pnpm turbo run test --filter=@signatureops/schema --filter=@signatureops/compiler --filter=@signatureops/linter --filter=@signatureops/rules --filter=@signatureops/adapters-google --filter=@signatureops/adapters-microsoft
      - run: pnpm turbo run test:unit --filter=@signatureops/web
      - run: pnpm turbo build --filter=@signatureops/web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signatureops
          AUTH_SECRET: ci-auth-secret-at-least-16
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PHASE: phase-production-build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signatureops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signatureops
      AUTH_SECRET: ci-auth-secret-at-least-16
      AUTH_BYPASS: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @signatureops/db generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @signatureops/web exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --filter=@signatureops/web
